<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Управление ценами — ТД Импульс</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Отключаем стрелки у полей ввода чисел */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-4 md:p-8 font-sans">

  <div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
    
    <!-- Шапка -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-3 sm:pb-4">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <a href="index.html" class="p-2 sm:p-2.5 bg-slate-900 border border-slate-800 rounded-xl hover:border-emerald-500/50 text-slate-400 hover:text-emerald-400 transition">
          <i class="fa-solid fa-arrow-left text-sm sm:text-base"></i>
        </a>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-100">Управление ценами</h1>
          <p class="text-[11px] sm:text-xs text-slate-400">ООО «Торговый Дом Импульс»</p>
        </div>
      </div>
    </header>

    <!-- Форма авторизации (токен) -->
    <div id="auth-card" class="bg-slate-900 p-5 sm:p-6 rounded-2xl border border-slate-800 shadow-xl max-w-md mx-auto hidden">
      <h2 class="text-sm font-semibold mb-2 flex items-center gap-2">
        <i class="fa-solid fa-key text-emerald-400"></i> Авторизация GitHub API
      </h2>
      <p class="text-xs text-slate-400 mb-4">Введите ваш Personal Access Token (PAT):</p>
      <input type="password" id="gh-token" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm mb-4 focus:outline-none focus:border-emerald-500 text-slate-200" placeholder="github_pat_xxxxxxxxxxxx">
      <button onclick="saveToken()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm transition">
        Сохранить ключ
      </button>
    </div>

    <!-- Основное содержимое -->
    <main id="app-content" class="hidden space-y-4 sm:space-y-6">

      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center bg-slate-900/50 p-3.5 sm:p-4 rounded-xl border border-slate-800/80 gap-3">
        <span class="text-xs text-slate-400 flex items-center"><i class="fa-solid fa-circle-info text-emerald-400 mr-1.5 shrink-0"></i> Данные каталога загружены</span>
        <button onclick="saveAllPrices()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 sm:py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95">
          <i class="fa-solid fa-cloud-arrow-up"></i> <span>Опубликовать все цены</span>
        </button>
      </div>

      <!-- Контейнер карточек товаров -->
      <div class="space-y-3 sm:space-y-4" id="products-list">
        <div class="text-center text-slate-500 py-8 text-sm" id="loading-state">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i> Загрузка списка товаров из catalog.html...
        </div>
      </div>

    </main>

  </div>

  <!-- Полноэкранная затеняющая плашка статуса -->
  <div id="status-overlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="relative bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-6">
      
      <!-- Крестик для закрытия -->
      <button onclick="closeOverlay()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-100 bg-slate-800/50 hover:bg-slate-800 rounded-full transition">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>

      <!-- Анимированный лоадер -->
      <div class="flex justify-center pt-2">
        <div id="overlay-icon-box" class="relative w-20 h-20 flex items-center justify-center bg-blue-500/10 text-blue-400 rounded-full border border-blue-500/20">
          <i id="overlay-icon" class="fa-solid fa-cloud-arrow-up text-3xl animate-bounce"></i>
        </div>
      </div>

      <!-- Текстовый статус -->
      <div class="space-y-2">
        <div id="overlay-step" class="text-xs font-bold uppercase tracking-wider text-blue-400">1/3 Отправка</div>
        <h3 id="overlay-title" class="text-lg font-bold text-slate-100">Отправляю новые цены...</h3>
        <p id="overlay-desc" class="text-xs text-slate-400 leading-relaxed">Запись изменений в репозиторий GitHub</p>
      </div>

      <!-- Состояние сборки -->
      <div class="pt-2 border-t border-slate-800/80">
        <span id="overlay-timer" class="text-[11px] font-mono text-slate-500">Время ожидания: 0 с</span>
      </div>

    </div>
  </div>

<script>
  const SITE_REPO_OWNER = 'TDImpulse';
  const SITE_REPO_NAME = 'tdimpulse.github.io';
  let timerInterval = null;
  let timerSeconds = 0;

  function validateMinPrice(input) {
    let val = parseInt(input.value);
    if (isNaN(val) || val < 0) {
      val = 0;
    }
    
    const card = input.closest('[data-product-id]');
    if (!card) return;
    
    const vatCheckbox = card.querySelector('.vat-checkbox');
    const vatLabel = card.querySelector('.vat-label');

    if (val === 0) {
      input.classList.remove('text-emerald-400');
      input.classList.add('text-amber-400');
      if (vatCheckbox) vatCheckbox.classList.add('hidden');
      if (vatLabel) {
        vatLabel.textContent = 'ДОГОВОРНАЯ';
        vatLabel.className = 'vat-label text-xs font-bold text-amber-400 tracking-wider uppercase select-none';
      }
    } else {
      input.classList.remove('text-amber-400');
      input.classList.add('text-emerald-400');
      if (vatCheckbox) vatCheckbox.classList.remove('hidden');
      if (vatLabel) {
        vatLabel.textContent = vatCheckbox.checked ? 'с НДС' : 'без НДС';
        vatLabel.className = 'vat-label text-sm sm:text-xs text-slate-200 font-medium cursor-pointer select-none';
      }
    }
  }

  function toggleVatLabel(checkbox) {
    const card = checkbox.closest('[data-product-id]');
    const priceInput = card ? card.querySelector('.price-input') : null;
    const val = priceInput ? parseInt(priceInput.value) : 0;
    
    if (val > 0) {
      const label = checkbox.parentElement.querySelector('.vat-label');
      label.textContent = checkbox.checked ? 'с НДС' : 'без НДС';
    }
  }

  function getToken() { 
    return localStorage.getItem('crm_github_token') || localStorage.getItem('gh_pat_token') || localStorage.getItem('price_admin_token') || ''; 
  }

  function saveToken() {
    const token = document.getElementById('gh-token').value.trim();
    if (token) {
      localStorage.setItem('crm_github_token', token);
      localStorage.setItem('gh_pat_token', token);
      localStorage.setItem('price_admin_token', token);
      initAdmin();
    } else {
      alert('Пожалуйста, введите токен');
    }
  }

  async function fetchProductsFromCatalog() {
    let htmlText = '';
    const sources = [
      'catalog.html?t=' + Date.now(),
      'https://raw.githubusercontent.com/TDImpulse/tdimpulse.github.io/main/catalog.html',
      'https://tdimpulse.ru/catalog.html'
    ];

    for (const url of sources) {
      try {
        const response = await fetch(url);
        if (response.ok) {
          htmlText = await response.text();
          if (htmlText) break;
        }
      } catch (e) {
        console.warn(`Не удалось загрузить с ${url}`);
      }
    }

    if (htmlText) {
      try {
        const match = htmlText.match(/(?:const|let|var)\s+(?:products|catalog|items|productsData)\s*=\s*(\[\s*[\s\S]*?\]);/i);
        if (match && match[1]) {
          return Function('"use strict";return (' + match[1] + ')')();
        }
      } catch (e) {
        console.error('Ошибка вычисления массива:', e);
      }
    }
    return [];
  }

  async function fetchCurrentPrices() {
    const timestamp = Date.now();
    const sources = [
      `https://tdimpulse.ru/prices.json?t=${timestamp}`,
      `prices.json?t=${timestamp}`,
      `https://raw.githubusercontent.com/TDImpulse/tdimpulse.github.io/main/prices.json?t=${timestamp}`
    ];

    for (const url of sources) {
      try {
        const res = await fetch(url);
        if (res.ok) {
          return await res.json();
        }
      } catch (e) {
        console.warn(`Не удалось прочитать prices.json с ${url}`);
      }
    }
    return {};
  }

  async function initAdmin() {
    const token = getToken();
    if (!token) {
      document.getElementById('auth-card').classList.remove('hidden');
      document.getElementById('app-content').classList.add('hidden');
      return;
    }

    document.getElementById('auth-card').classList.add('hidden');
    document.getElementById('app-content').classList.remove('hidden');

    const container = document.getElementById('products-list');

    const [products, existingPrices] = await Promise.all([
      fetchProductsFromCatalog(),
      fetchCurrentPrices()
    ]);

    if (!products || products.length === 0) {
      container.innerHTML = '<div class="text-center text-rose-400 py-8 text-sm">Не удалось извлечь товары из catalog.html.<br><span class="text-xs text-slate-500">Проверьте консоль браузера (F12)</span></div>';
      return;
    }

    container.innerHTML = '';

    products.forEach((prod, idx) => {
      const cleanFileName = prod.url ? prod.url.replace(/^.*[\\\/]/, '') : `product_${idx}.html`;
      const prodId = cleanFileName.replace('.html', '');
      const fullWebUrl = `https://tdimpulse.ru/${cleanFileName}`;

      const savedData = existingPrices[prodId] || {};
      const priceVal = savedData.price !== undefined ? savedData.price : "0";
      const isZero = parseInt(priceVal) === 0 || priceVal === "";
      const hasVat = savedData.vatIncluded !== undefined ? savedData.vatIncluded : true;

      const cardHtml = `
        <div class="p-4 sm:p-5 bg-slate-900 rounded-2xl border border-slate-800 space-y-3 sm:space-y-4" data-product-id="${prodId}" data-product-url="${cleanFileName}">
          <div class="border-b border-slate-800/60 pb-2.5">
            <h3 class="text-base sm:text-lg font-bold text-slate-100 leading-snug">
              <a href="${fullWebUrl}" target="_blank" class="hover:text-emerald-400 transition">
                ${prod.title || 'Товар'}
              </a>
            </h3>
            ${prod.standard ? `<div class="text-xs text-slate-400 font-normal mt-1">${prod.standard}</div>` : ''}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 items-end">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1.5">Цена (руб/т)</label>
              <input type="number" min="0" value="${priceVal}" data-initial-value="${priceVal}" onfocus="this.select()" oninput="validateMinPrice(this)" class="price-input w-full p-3 sm:p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-base sm:text-sm font-semibold ${isZero ? 'text-amber-400' : 'text-emerald-400'} focus:outline-none focus:border-emerald-500" placeholder="0">
            </div>

            <div class="flex items-center justify-center sm:justify-start gap-3 bg-slate-950 p-3 sm:p-2.5 rounded-xl border border-slate-800 h-[46px] sm:h-[42px] cursor-pointer" onclick="const cb = this.querySelector('.vat-checkbox'); if(cb && !cb.classList.contains('hidden')) cb.click()">
              <input type="checkbox" id="vat-${prodId}" class="vat-checkbox w-5 h-5 sm:w-4 sm:h-4 accent-emerald-500 rounded cursor-pointer ${isZero ? 'hidden' : ''}" ${hasVat ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleVatLabel(this)">
              <label for="vat-${prodId}" class="vat-label select-none ${isZero ? 'text-xs font-bold text-amber-400 tracking-wider uppercase' : 'text-sm sm:text-xs text-slate-200 font-medium cursor-pointer'}">${isZero ? 'ДОГОВОРНАЯ' : (hasVat ? 'с НДС' : 'без НДС')}</label>
            </div>
          </div>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', cardHtml);
    });

    const bottomPanelHtml = `
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center bg-slate-900/50 p-3.5 sm:p-4 rounded-xl border border-slate-800/80 gap-3 mt-6">
        <span class="text-xs text-slate-400 flex items-center"><i class="fa-solid fa-circle-info text-emerald-400 mr-1.5 shrink-0"></i> Данные каталога загружены</span>
        <button onclick="saveAllPrices()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 sm:py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95">
          <i class="fa-solid fa-cloud-arrow-up"></i> <span>Опубликовать все цены</span>
        </button>
      </div>
    `;
    
    container.insertAdjacentHTML('afterend', bottomPanelHtml);
  }

  // Функции работы с полноэкранной плашкой
  function updateOverlay(step, title, desc, iconClass, colorTheme) {
    document.getElementById('overlay-step').textContent = step;
    document.getElementById('overlay-title').textContent = title;
    document.getElementById('overlay-desc').textContent = desc;
    
    const iconEl = document.getElementById('overlay-icon');
    const iconBox = document.getElementById('overlay-icon-box');

    iconEl.className = `fa-solid ${iconClass} text-3xl`;

    if (colorTheme === 'blue') {
      document.getElementById('overlay-step').className = 'text-xs font-bold uppercase tracking-wider text-blue-400';
      iconBox.className = 'relative w-20 h-20 flex items-center justify-center bg-blue-500/10 text-blue-400 rounded-full border border-blue-500/20';
    } else if (colorTheme === 'amber') {
      document.getElementById('overlay-step').className = 'text-xs font-bold uppercase tracking-wider text-amber-400';
      iconBox.className = 'relative w-20 h-20 flex items-center justify-center bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20';
    } else if (colorTheme === 'emerald') {
      document.getElementById('overlay-step').className = 'text-xs font-bold uppercase tracking-wider text-emerald-400';
      iconBox.className = 'relative w-20 h-20 flex items-center justify-center bg-emerald-500/10 text-emerald-400 rounded-full border border-emerald-500/20';
    } else if (colorTheme === 'rose') {
      document.getElementById('overlay-step').className = 'text-xs font-bold uppercase tracking-wider text-rose-400';
      iconBox.className = 'relative w-20 h-20 flex items-center justify-center bg-rose-500/10 text-rose-400 rounded-full border border-rose-500/20';
    }
  }

  function startOverlayTimer() {
    timerSeconds = 0;
    clearInterval(timerInterval);
    document.getElementById('overlay-timer').textContent = 'Время ожидания: 0 с';
    timerInterval = setInterval(() => {
      timerSeconds++;
      document.getElementById('overlay-timer').textContent = `Время ожидания: ${timerSeconds} с`;
    }, 1000);
  }

  function closeOverlay() {
    clearInterval(timerInterval);
    document.getElementById('status-overlay').classList.add('hidden');
  }

async function saveAllPrices() {
    const token = getToken();
    if (!token) return alert('Введите токен доступа');

    document.getElementById('status-overlay').classList.remove('hidden');
    startOverlayTimer();

    // -------------------------------------------------------------
    // ЭТАП 0: Находим измененный товар и запоминаем ЕГО ТЕКУЩИЙ HTML
    // -------------------------------------------------------------
    updateOverlay('Подготовка', 'Анализ изменений...', 'Считываем текущую страницу витрины...', 'fa-magnifying-glass animate-pulse', 'amber');

    const productsData = {};
    let targetProductId = null;
    let targetProductUrl = null;
    let expectedPriceVal = null;

    const cards = document.querySelectorAll('#products-list > div[data-product-id]');
    
    cards.forEach((card) => {
      const id = card.getAttribute('data-product-id');
      const url = card.getAttribute('data-product-url');
      const priceInput = card.querySelector('.price-input');
      const val = parseInt(priceInput.value.trim());
      const price = (isNaN(val) || val <= 0) ? "0" : String(val);
      const hasVat = card.querySelector('.vat-checkbox').checked;

      productsData[id] = { price: price, vatIncluded: hasVat };

      const initialVal = priceInput.getAttribute('data-initial-value');
      if (initialVal !== price || !targetProductId) {
        targetProductId = id;
        targetProductUrl = url;
        expectedPriceVal = price;
      }
    });

    // Запоминаем текущий HTML страницы ДО отправки
    const initialPageHtml = await fetchCurrentPageHtml(targetProductUrl);

    // -------------------------------------------------------------
    // ЭТАП 1: Отправка нового prices.json на GitHub
    // -------------------------------------------------------------
    updateOverlay('1/3 Отправка', 'Отправляю новые цены...', 'Запись файла prices.json через GitHub API', 'fa-paper-plane animate-pulse', 'amber');

    try {
      let sha = '';
      const getFileRes = await fetch(`https://api.github.com/repos/${SITE_REPO_OWNER}/${SITE_REPO_NAME}/contents/prices.json`, {
        headers: { 'Authorization': `token ${token}` }
      });
      
      if (getFileRes.ok) {
        const fileData = await getFileRes.json();
        sha = fileData.sha;
      }

      const jsonString = JSON.stringify(productsData, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

      const putRes = await fetch(`https://api.github.com/repos/${SITE_REPO_OWNER}/${SITE_REPO_NAME}/contents/prices.json`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'CRM: Обновление цен каталога',
          content: contentBase64,
          sha: sha || undefined
        })
      });

      if (!putRes.ok) {
        updateOverlay('Ошибка', 'Не удалось сохранить', 'Проверьте токен доступа', 'fa-triangle-exclamation', 'rose');
        return;
      }

      // -------------------------------------------------------------
      // ЭТАП 2: Ждем, когда обновится prices.json на сервере
      // -------------------------------------------------------------
      updateOverlay('2/3 Сервер', 'Ожидаем изменения цен каталога', 'Проверяем обновление файла цен на tdimpulse.ru...', 'fa-circle-notch fa-spin', 'blue');

      const isJsonReady = await waitForJsonUpdate(targetProductId, expectedPriceVal);

      if (!isJsonReady) {
        updateOverlay('Завершено', 'Файл сохранен', 'GitHub принял изменения, витрина обновится через несколько секунд', 'fa-clock', 'amber');
        return;
      }

      // -------------------------------------------------------------
      // ЭТАП 3: Опрашиваем HTML страницы каждые 5 сек (ждем изменений)
      // -------------------------------------------------------------
      updateOverlay('2/3 Проверка витрины', 'Отрисовка карточек товара', `Проверяем изменения на странице ${targetProductUrl}...`, 'fa-circle-notch fa-spin', 'blue');

      const isPageChanged = await waitForHtmlPageChange(targetProductUrl, initialPageHtml);

      if (isPageChanged) {
        // Запоминаем текущее значение инпута как начальное
        document.querySelectorAll('#products-list > div[data-product-id]').forEach(card => {
          const inp = card.querySelector('.price-input');
          if (inp) inp.setAttribute('data-initial-value', inp.value.trim());
        });

        updateOverlay('3/3 Готово!', 'Сайт полностью обновлен!', 'Новые ценники уже отображаются на страницах товаров', 'fa-check', 'emerald');
        setTimeout(() => closeOverlay(), 2500);
      } else {
        updateOverlay('Завершено', 'Файл сохранен', 'JSON обновился, витрина обновится через несколько секунд', 'fa-clock', 'amber');
      }

    } catch (e) {
      console.error(e);
      updateOverlay('Ошибка', 'Сбой сети', 'Не удалось проверить статус', 'fa-wifi', 'rose');
    }
  }

  // Вспомогательная функция: Скачивает текущий HTML код страницы
  async function fetchCurrentPageHtml(pageUrl) {
    const fullUrl = pageUrl.startsWith('http') ? pageUrl : `https://tdimpulse.ru/${pageUrl}`;
    try {
      const res = await fetch(`${fullUrl}?init_check=${Date.now()}`, { cache: 'no-store' });
      if (res.ok) {
        return await res.text();
      }
    } catch (e) {
      console.warn('Не удалось прочитать исходную страницу', e);
    }
    return '';
  }

  // ЭТАП 2: Ждем обновление JSON на боевом домене
  async function waitForJsonUpdate(productId, expectedPrice, maxAttempts = 15) {
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 3000));
      try {
        const res = await fetch(`https://tdimpulse.ru/prices.json?t=${Date.now()}_${attempt}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data[productId] && String(data[productId].price) === String(expectedPrice)) {
            return true;
          }
        }
      } catch (e) {}
    }
    return false;
  }

  // ЭТАП 3: Опрашиваем страницу каждые 5 секунд и сравниваем со старым HTML
  async function waitForHtmlPageChange(pageUrl, oldHtml, maxAttempts = 20) {
    const fullUrl = pageUrl.startsWith('http') ? pageUrl : `https://tdimpulse.ru/${pageUrl}`;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 5000)); // Интервал ровно 5 секунд

      try {
        const res = await fetch(`${fullUrl}?cache_bust=${Date.now()}_${attempt}`, { cache: 'no-store' });
        if (res.ok) {
          const currentHtml = await res.text();

          // Если сохраненный старый HTML и новый полученный HTML РАЗНЫЕ — страница обновилась!
          if (oldHtml && currentHtml !== oldHtml) {
            return true;
          }
        }
      } catch (e) {
        console.warn('Ожидание смены HTML...', e);
      }
    }
    return false;
  }

  document.addEventListener('DOMContentLoaded', initAdmin);
</script>
</body>
</html>
